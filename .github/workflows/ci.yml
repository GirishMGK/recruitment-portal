name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Verify app & embedded launcher payload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile-check the app
        run: python -m py_compile statutory_extractor.py

      - name: Verify embedded Base64 payload matches statutory_extractor.py
        run: |
          python - <<'PY'
          import base64, hashlib, sys

          bat = "Statutory_Extractor.bat"
          app = "statutory_extractor.py"
          marker = "#####APP" + "_BASE64#####"

          # Read the .bat as raw lines (it uses CRLF endings on Windows).
          raw = open(bat, "rb").read().decode("latin-1")
          lines = raw.replace("\r\n", "\n").split("\n")

          # The marker literal only appears on the data line, never split.
          idx = next((i for i, l in enumerate(lines) if l.strip() == marker), -1)
          if idx < 0:
              sys.exit(f"ERROR: marker line not found in {bat}")

          b64 = "".join(l.strip() for l in lines[idx + 1:] if l.strip())
          decoded = base64.b64decode(b64)
          original = open(app, "rb").read()

          d_hash = hashlib.sha256(decoded).hexdigest()
          o_hash = hashlib.sha256(original).hexdigest()
          print(f"embedded bytes : {len(decoded)}  sha256={d_hash}")
          print(f"original bytes : {len(original)}  sha256={o_hash}")

          if d_hash != o_hash:
              sys.exit("ERROR: embedded payload does NOT match statutory_extractor.py. "
                       "Re-generate the .bat after editing the app.")
          print("OK: embedded payload matches statutory_extractor.py byte-for-byte.")
          PY

      - name: Sanity-check the launcher structure
        run: |
          python - <<'PY'
          import sys
          raw = open("Statutory_Extractor.bat", "rb").read().decode("latin-1")
          required = [
              "streamlit run",
              "-m venv",
              "pip install",
              "FromBase64String",
          ]
          missing = [s for s in required if s not in raw]
          if missing:
              sys.exit(f"ERROR: launcher is missing expected steps: {missing}")
          print("OK: launcher contains venv setup, pip install, decode, and streamlit run.")
          PY
